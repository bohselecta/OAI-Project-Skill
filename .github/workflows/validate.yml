name: Validate Project
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-29
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-29
        with:
          python-version: ${{ matrix.python }}
      - name: Validate sealed skill
        run: python scripts/project_tool.py validate
      - name: Run deterministic tests (no model calls)
        run: python -m unittest discover -s tests -v
      - name: Create verified standalone distribution
        run: python scripts/project_tool.py pack --out "${{ runner.temp }}/project-skill.zip"
