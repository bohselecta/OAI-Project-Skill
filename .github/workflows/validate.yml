name: Validate Project
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Capture exact source
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: git archive --format=tar HEAD > "${{ runner.temp }}/project-source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: project-source
          path: ${{ runner.temp }}/project-source.tar
          retention-days: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate sealed skill
        run: python scripts/project_tool.py validate
      - name: Verify Claude Code distribution
        run: python scripts/build_claude_skill.py --check
      - name: Verify isolated Claude SayFrame adapter
        run: node --test integrations/sayframe/tests/claude-adapter.test.mjs
      - name: Run deterministic tests (no model calls)
        run: python -m unittest discover -s tests -v
      - name: Verify SayFrame connector and local intake (no model calls)
        run: node --test integrations/sayframe/tests/connector.test.mjs
      - name: Create verified standalone distribution
        run: python scripts/project_tool.py pack --out "${{ runner.temp }}/project-skill.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: project-skill
          path: ${{ runner.temp }}/project-skill.zip
          retention-days: 7
