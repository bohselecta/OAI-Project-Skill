name: Validate Project
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-09-29
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, verified 2026-09-29
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, verified 2026-09-29
        with:
          node-version: '22'
      - name: Validate sealed skill
        run: python scripts/project_tool.py validate
      - name: Run deterministic tests (no model calls)
        run: python -m unittest discover -s tests -v
      - name: Verify SayFrame connector and local intake (no model calls)
        run: node --test integrations/sayframe/tests/connector.test.mjs
      - name: Create verified standalone distribution
        run: python scripts/project_tool.py pack --out "${{ runner.temp }}/project-skill.zip"
